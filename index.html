<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faid & Wildan</title>

<style>
body{
margin:0;
font-family: 'Georgia', serif;
background:#000;
color:#fff;
overflow-x:hidden;
}

/* شاشة البداية */
#intro{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.title{
font-size:40px;
letter-spacing:3px;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{opacity:0.4}
to{opacity:1}
}

.enter{
margin-top:30px;
padding:12px 25px;
border:1px solid gold;
background:none;
color:gold;
cursor:pointer;
}

/* الصفحة الرئيسية */
.main{
display:none;
text-align:center;
padding:40px 20px;
background:linear-gradient(#000,#111);
}

/* خلفية متحركة */
.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:url('https://images.unsplash.com/photo-1519741497674-611481863552') center/cover;
opacity:0.2;
z-index:-1;
animation: zoom 20s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.2)}
}

h1{
font-size:45px;
color:gold;
}

/* عداد */
.count{
display:flex;
justify-content:center;
gap:10px;
margin-top:30px;
}

.box{
border:1px solid gold;
padding:10px;
}

.map{
margin-top:30px;
display:inline-block;
padding:10px 20px;
border:1px solid gold;
color:gold;
text-decoration:none;
}
</style>
</head>

<body>

<div id="intro">
<div class="title">Faid & Wildan</div>
<button class="enter" onclick="enterSite()">Enter</button>
</div>

<div class="main" id="main">
<div class="bg"></div>

<h1>Wedding Invitation</h1>
<p>We invite you to celebrate with us</p>

<h2>9 October 2026</h2>
<p>6:00 PM - 9:00 PM</p>
<p>Hammurabi City VIP C</p>

<div class="count">
<div class="box"><span id="d">0</span><br>Days</div>
<div class="box"><span id="h">0</span><br>Hours</div>
<div class="box"><span id="m">0</span><br>Min</div>
<div class="box"><span id="s">0</span><br>Sec</div>
</div>

<a class="map" href="https://www.google.com/maps/search/?api=1&query=مدينة+حمورابي+VIP+C" target="_blank">View Location</a>

<br><br>

<audio id="music" controls>
<source src="PUT-YOUR-SONG-LINK.mp3">
</audio>

</div>

<script>
function enterSite(){
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="block";
document.getElementById("music").play();
}

const target = new Date("2026-10-09T18:00:00").getTime();

function update(){
let now = new Date().getTime();
let diff = target - now;

let d = Math.floor(diff/(1000*60*60*24));
let h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let m = Math.floor((diff%(1000*60*60))/(1000*60));
let s = Math.floor((diff%(1000*60))/1000);

document.getElementById("d").innerHTML=d;
document.getElementById("h").innerHTML=h;
document.getElementById("m").innerHTML=m;
document.getElementById("s").innerHTML=s;
}

setInterval(update,1000);
</script>

</body>
</html>
